<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="64" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-4" y="-4" width="72" height="72" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)" />
  <!-- Gloss highlight -->
  <rect x="3" y="3" width="58" height="28" rx="14" fill="url(#shine)" />
  <!-- Squircle border -->
  <rect x="2" y="2" width="60" height="60" rx="15" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  <!-- AP Monogram -->
  <text x="32" y="41" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1" filter="url(#shadow)">AP</text>
  <!-- Mini status dot (emerald active) -->
  <circle cx="50" cy="14" r="3.5" fill="#10b981" stroke="#0f172a" stroke-width="1.5" />
</svg>