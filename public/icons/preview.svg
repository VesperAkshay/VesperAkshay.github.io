<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="prevBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4CA1FF"/>
      <stop offset="100%" stop-color="#146CE6"/>
    </linearGradient>
    <filter id="prevShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#prevBg)" filter="url(#prevShadow)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
  <!-- Overlapping photos / documents -->
  <g transform="translate(14, 18)">
    <!-- Back document / photo -->
    <rect x="18" y="8" width="56" height="68" rx="4" fill="#E8EEF5" transform="rotate(12, 46, 42)"/>
    <!-- Front document / PDF -->
    <rect x="14" y="10" width="56" height="68" rx="4" fill="#FFFFFF" transform="rotate(-6, 42, 44)"/>
    <!-- Loupe / Magnifying glass -->
    <g transform="translate(42, 34)">
      <circle cx="20" cy="20" r="16" fill="none" stroke="#2C3440" stroke-width="5"/>
      <circle cx="20" cy="20" r="13" fill="#60A5FA" fill-opacity="0.35"/>
      <line x1="31" y1="31" x2="48" y2="48" stroke="#2C3440" stroke-width="6" stroke-linecap="round"/>
      <!-- Glare highlight on lens -->
      <path d="M12 14 A 12 12 0 0 1 24 10" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
