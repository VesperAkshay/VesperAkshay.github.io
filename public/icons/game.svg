<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="gameBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="padBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="gameShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#gameBg)" filter="url(#gameShadow)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>

  <!-- Subtle glossy highlight -->
  <path d="M14 26 C14 18 20 12 28 12 L100 12 C108 12 114 18 114 26 C114 44 80 50 14 36 Z" fill="rgba(255,255,255,0.18)"/>

  <!-- Gamepad Body -->
  <g filter="url(#gameShadow)" transform="translate(18, 34)">
    <path d="M22 6 C12 6 4 14 4 24 C4 38 12 56 22 56 C28 56 34 50 46 50 C58 50 64 56 70 56 C80 56 88 38 88 24 C88 14 80 6 70 6 C62 6 56 12 46 12 C36 12 30 6 22 6 Z" fill="url(#padBody)" />
    
    <!-- D-Pad (Left) -->
    <rect x="19" y="21" width="8" height="20" rx="2" fill="#334155"/>
    <rect x="13" y="27" width="20" height="8" rx="2" fill="#334155"/>
    <circle cx="23" cy="31" r="2" fill="#1E293B"/>

    <!-- Action Buttons (Right) -->
    <circle cx="69" cy="22" r="3.5" fill="#EF4444"/> <!-- Top: Red -->
    <circle cx="78" cy="31" r="3.5" fill="#3B82F6"/> <!-- Right: Blue -->
    <circle cx="69" cy="40" r="3.5" fill="#10B981"/> <!-- Bottom: Green -->
    <circle cx="60" cy="31" r="3.5" fill="#F59E0B"/> <!-- Left: Yellow -->

    <!-- Center 2048 Badge -->
    <rect x="36" y="24" width="20" height="13" rx="3.5" fill="#1E1B4B" />
    <text x="46" y="33.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="7" font-weight="900" fill="#F43F5E" text-anchor="middle" letter-spacing="-0.5">2048</text>
  </g>
</svg>
