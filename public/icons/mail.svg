<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="mailBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38A5FD"/>
      <stop offset="100%" stop-color="#0066DF"/>
    </linearGradient>
    <filter id="mailShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="envGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECECEC"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#mailBg)" filter="url(#mailShadow)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
  <!-- Envelope body -->
  <rect x="22" y="38" width="84" height="54" rx="6" fill="url(#envGrad)"/>
  <!-- Envelope flap lines -->
  <path d="M22 41 L64 72 L106 41" fill="none" stroke="#B8C4D1" stroke-width="3" stroke-linejoin="round"/>
  <path d="M24 90 L50 64" stroke="#D1D9E0" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M104 90 L78 64" stroke="#D1D9E0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Small stamp badge -->
  <rect x="82" y="44" width="18" height="14" rx="2" fill="#E24A4A"/>
</svg>
